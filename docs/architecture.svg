<text x="340" y="370" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">FastAPI · POST /predict</text>
<text x="340" y="388" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Validates request via Pydantic</text>
</g>
<line x1="340" y1="408" x2="340" y2="444" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>

