<svg width="100%" viewBox="0 0 680 716" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Fraud detection API deployment architecture on AWS EC2</title>
<desc>A client sends a raw transaction over HTTP port 8000 to an AWS EC2 instance. A security group allows public traffic on port 8000 and restricts SSH. Inside the instance, systemd supervises a uvicorn process running the FastAPI app, which validates the request, preprocesses it, scores it with a Random Forest model at a 0.41 threshold, and returns a fraud flag and probability.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g>
<rect x="210" y="24" width="260" height="56" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">Client</text>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Sends raw transaction JSON</text>
</g>
<line x1="340" y1="80" x2="340" y2="124" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<text x="352" y="102" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">HTTP · port 8000</text>

<rect x="40" y="124" width="600" height="576" rx="10" style="fill:none;stroke:rgb(180, 178, 172);stroke-width:1px;stroke-dasharray:4 4"/>
<text x="60" y="148" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500">AWS EC2 · Ubuntu 24.04 · t3.micro</text>

<g>
<rect x="80" y="168" width="520" height="56" rx="8" style="fill:rgb(253, 240, 227);stroke:rgb(178, 102, 22);stroke-width:0.5px"/>
<text x="340" y="186" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 77, 14);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">Security group</text>
<text x="340" y="204" text-anchor="middle" dominant-baseline="central" style="fill:rgb(178, 102, 22);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Port 8000 public · SSH restricted to a single address</text>
</g>
<line x1="340" y1="224" x2="340" y2="260" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>

<g>
<rect x="80" y="260" width="520" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">systemd · uvicorn</text>
<text x="340" y="296" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Restarts on failure and on reboot</text>
</g>
<line x1="340" y1="316" x2="340" y2="352" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>

<g>
