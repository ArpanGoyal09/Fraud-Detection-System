<text x="340" y="480" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Scales amount, derives hour</text>
</g>
<line x1="340" y1="500" x2="340" y2="536" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>

<g>
<rect x="140" y="536" width="400" height="56" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5px"/>
<text x="340" y="554" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">Random forest model</text>
<text x="340" y="572" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Threshold applied at 0.41</text>
</g>
<line x1="340" y1="592" x2="340" y2="628" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>

<g>
<rect x="140" y="628" width="400" height="56" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/>
<text x="340" y="646" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">Response</text>
<text x="340" y="664" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Fraud flag + probability</text>
</g>
